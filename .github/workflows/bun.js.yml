name: Publish Hanzinception to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: "https://zalaxci.github.io/hanzinception"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Build
      run: bun run build
    - name: Setup Pages
      id: pages
      run: actions/configure-pages@v6
    - name: Upload Artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: "./dist"
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
